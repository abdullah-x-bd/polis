name: POLIS v2.0.7 final recovery execution

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v2-resume-final.yml
      - configs/v2_live_gate.json

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      armed: ${{ steps.gate.outputs.armed }}
      execution_sha: ${{ steps.gate.outputs.execution_sha }}
      head_branch: ${{ steps.gate.outputs.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: gate
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          gate = json.loads(Path('configs/v2_live_gate.json').read_text(encoding='utf-8'))
          armed = bool(gate.get('armed')) and gate.get('status') == 'armed_final_recovery'
          if armed:
              expected = {
                  'protocol_version': '2.0.7',
                  'config_digest': '05548c19126ebf1a71262ecd7675404d35b7c3f003f8eef19ef0ae3c827b756f',
                  'design_digest': '6efba6e49955923ce13d70e7e4e672f3173a83c1bed0522b7eae65452023b964',
                  'study_fingerprint': '911c55b1d71e29b9ef1d1addc7131a4edbe2ecbb4a63fd87a7f423009a0686be',
                  'expected_episodes': 5280,
                  'max_total_cost_usd': 4.6,
                  'recovery_cache_run_id': '31354324514',
              }
              for key, value in expected.items():
                  if gate.get(key) != value:
                      raise SystemExit(f'Gate mismatch for {key}: {gate.get(key)!r} != {value!r}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"armed={'true' if armed else 'false'}\n")
              handle.write(f"execution_sha={os.environ['PR_HEAD_SHA']}\n")
              handle.write(f"head_branch={os.environ['PR_HEAD_REF']}\n")
          print(f'POLIS_V2_FINAL_RECOVERY_ARMED={armed}')
          PY

  live:
    name: final live batch ${{ matrix.batch }}
    needs: gate
    if: needs.gate.outputs.armed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - batch: 0
            shards: "0 1 2 3 4 5"
            budget: "1.15"
          - batch: 1
            shards: "6 7 8 9 10 11"
            budget: "1.15"
          - batch: 2
            shards: "12 13 14 15 16 17"
            budget: "1.15"
          - batch: 3
            shards: "18 19 20 21 22 23"
            budget: "1.15"
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXPECTED_CONFIG_DIGEST: 05548c19126ebf1a71262ecd7675404d35b7c3f003f8eef19ef0ae3c827b756f
      EXPECTED_DESIGN_DIGEST: 6efba6e49955923ce13d70e7e4e672f3173a83c1bed0522b7eae65452023b964
      EXPECTED_FINGERPRINT: 911c55b1d71e29b9ef1d1addc7131a4edbe2ecbb4a63fd87a7f423009a0686be
      EXECUTION_SHA: ${{ needs.gate.outputs.execution_sha }}
      BATCH_INDEX: ${{ matrix.batch }}
      SHARD_LIST: ${{ matrix.shards }}
      BATCH_BUDGET_USD: ${{ matrix.budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.execution_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify immutable v2.0.7 design
        run: |
          python - <<'PY'
          import os
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest

          p = load_protocol('configs/v2_protocol.json')
          checks = {
              'config': (p.config_digest(), os.environ['EXPECTED_CONFIG_DIGEST']),
              'design': (design_digest(), os.environ['EXPECTED_DESIGN_DIGEST']),
              'fingerprint': (p.study_fingerprint(), os.environ['EXPECTED_FINGERPRINT']),
          }
          for name, (actual, expected) in checks.items():
              print(name, actual)
              if actual != expected:
                  raise SystemExit(f'{name} mismatch: {actual} != {expected}')
          if p.protocol_version != '2.0.7' or p.status != 'frozen':
              raise SystemExit('Final collection requires frozen v2.0.7')
          PY
      - name: Download merged exact-request recovery cache
        uses: actions/download-artifact@v4
        with:
          name: polis-v207-cache-recovery-audit
          path: recovery-source
          github-token: ${{ github.token }}
          run-id: 31354324514
      - name: Revalidate every cached response under v2.0.7 parser
        run: |
          mkdir -p "results/v2/live/batch-${BATCH_INDEX}/cache"
          cp -a recovery-source/cache/. "results/v2/live/batch-${BATCH_INDEX}/cache/"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from polis.v1.providers.openrouter import OpenRouterProvider

          cache = Path(f"results/v2/live/batch-{os.environ['BATCH_INDEX']}/cache")
          valid = 0
          removed = []
          for path in sorted(cache.glob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              response = payload.get('response') or {}
              raw = response.get('raw_text') or ''
              try:
                  action, truncated, dropped, filled = OpenRouterProvider._parse_action_content(raw)
              except Exception as exc:
                  removed.append({'request_sha256': path.stem, 'error': f'{type(exc).__name__}: {exc}'})
                  path.unlink()
                  continue
              response['action'] = action.model_dump(mode='json')
              metadata = dict(response.get('response_metadata') or {})
              metadata.update({
                  'revalidated_under_v207': True,
                  'justification_truncated': truncated,
                  'justification_limit_chars': OpenRouterProvider.JUSTIFICATION_MAX_CHARS,
                  'dropped_extra_fields': dropped,
                  'filled_missing_nullable_fields': filled,
              })
              response['response_metadata'] = metadata
              payload['response'] = response
              path.write_text(json.dumps(payload, sort_keys=True) + '\n', encoding='utf-8')
              valid += 1
          audit = {'valid_cache_objects': valid, 'removed_cache_objects': removed}
          Path(f"results/v2/live/batch-{os.environ['BATCH_INDEX']}/cache-revalidation.json").write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(audit, indent=2))
          if len(removed) != 1:
              raise SystemExit(f'Expected exactly one obsolete cache object to be rejected, found {len(removed)}')
          PY
      - name: Execute frozen shards, replaying valid cache first
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from polis.v1.providers.budget import BudgetExceeded, BudgetTracker
          from polis.v1.providers.cache import FileResponseCache
          from polis.v1.providers.openrouter import OpenRouterProvider
          from polis.v2.live import run_study
          from polis.v2.protocol import load_protocol

          protocol = load_protocol('configs/v2_protocol.json')
          if protocol.study_fingerprint() != os.environ['EXPECTED_FINGERPRINT']:
              raise SystemExit('Fingerprint changed after gate')

          batch = int(os.environ['BATCH_INDEX'])
          shards = [int(value) for value in os.environ['SHARD_LIST'].split()]
          root = Path(f'results/v2/live/batch-{batch}')
          os.environ['GITHUB_SHA'] = os.environ['EXECUTION_SHA']

          budget = BudgetTracker(
              max_cost_usd=float(os.environ['BATCH_BUDGET_USD']),
              ledger_path=root / f'ledger-batch-{batch}.jsonl',
              reserve_per_request_usd=0.01,
          )
          provider = OpenRouterProvider(
              cache=FileResponseCache(root / 'cache'),
              budget=budget,
              max_tokens=protocol.max_tokens,
              temperature=protocol.temperature,
              reasoning_overrides=protocol.reasoning_overrides(),
              reasoning_effort_overrides=protocol.reasoning_effort_overrides(),
          )
          studies = [
              'delegation_main', 'wording_robustness', 'heterogeneous',
              'commons_salience', 'frontier',
          ]
          manifests = []
          for shard in shards:
              for study in studies:
                  last_error = None
                  for attempt in range(1, 5):
                      try:
                          manifest = run_study(
                              protocol=protocol,
                              provider=provider,
                              study=study,
                              output_dir=root / f'shard-{shard:02d}' / study,
                              shard_index=shard,
                              shard_count=24,
                          )
                          if manifest.status != 'complete':
                              raise RuntimeError(f'Incomplete manifest {manifest.run_id}: {manifest.status}')
                          manifests.append(manifest.model_dump(mode='json'))
                          last_error = None
                          break
                      except BudgetExceeded:
                          raise
                      except Exception as exc:
                          last_error = exc
                          print(f'Attempt {attempt}/4 failed shard={shard} study={study}: {type(exc).__name__}: {exc}')
                          if attempt < 4:
                              time.sleep(5 * attempt)
                  if last_error is not None:
                      raise last_error

          summary = {
              'batch': batch,
              'shards': shards,
              'manifests': len(manifests),
              'completed_episodes': sum(item['completed_episodes'] for item in manifests),
              'incremental_spend_usd': budget.spent_usd,
              'budget_usd': float(os.environ['BATCH_BUDGET_USD']),
              'study_fingerprint': protocol.study_fingerprint(),
              'execution_sha': os.environ['EXECUTION_SHA'],
              'cache_files_after_run': len(list((root / 'cache').glob('*.json'))),
          }
          (root / 'batch-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polis-v207-final-batch-${{ matrix.batch }}
          path: results/v2/live/batch-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 90

  analyse:
    name: validate 5,280, analyse, and commit evidence
    needs: [gate, live]
    if: needs.gate.outputs.armed == 'true' && needs.live.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_CONFIG_DIGEST: 05548c19126ebf1a71262ecd7675404d35b7c3f003f8eef19ef0ae3c827b756f
      EXPECTED_DESIGN_DIGEST: 6efba6e49955923ce13d70e7e4e672f3173a83c1bed0522b7eae65452023b964
      EXPECTED_FINGERPRINT: 911c55b1d71e29b9ef1d1addc7131a4edbe2ecbb4a63fd87a7f423009a0686be
      EXECUTION_SHA: ${{ needs.gate.outputs.execution_sha }}
      HEAD_BRANCH: ${{ needs.gate.outputs.head_branch }}
      EXECUTION_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: polis-v207-final-batch-*
          path: collected
      - name: Validate and combine exact frozen dataset
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter, defaultdict
          from pathlib import Path

          from polis.v2.live import V2EpisodeRecord
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest

          expected_counts = {
              'delegation_main': 2304,
              'wording_robustness': 1152,
              'heterogeneous': 576,
              'commons_salience': 960,
              'frontier': 288,
          }
          expected_fp = os.environ['EXPECTED_FINGERPRINT']
          protocol = load_protocol('configs/v2_protocol.json')
          if protocol.protocol_version != '2.0.7' or protocol.status != 'frozen':
              raise SystemExit('Expected frozen v2.0.7')
          if protocol.config_digest() != os.environ['EXPECTED_CONFIG_DIGEST']:
              raise SystemExit('Config digest changed')
          if protocol.study_fingerprint() != expected_fp or design_digest() != os.environ['EXPECTED_DESIGN_DIGEST']:
              raise SystemExit('Frozen fingerprint/design changed')

          source_files = sorted(Path('collected').rglob('polis-v2-*.jsonl'))
          if len(source_files) != 120:
              raise SystemExit(f'Expected 120 result files, found {len(source_files)}')
          records = []
          for path in source_files:
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      records.append(V2EpisodeRecord.model_validate_json(line))
          if len(records) != 5280:
              raise SystemExit(f'Expected 5280 episodes, found {len(records)}')
          keys = [record.completion_key() for record in records]
          if len(set(keys)) != 5280:
              raise SystemExit(f'Expected 5280 unique completion keys, found {len(set(keys))}')
          if {record.study_fingerprint for record in records} != {expected_fp}:
              raise SystemExit('Mixed fingerprints in final dataset')
          counts = Counter(record.study for record in records)
          if dict(counts) != expected_counts:
              raise SystemExit(f'Study counts mismatch: {dict(counts)}')

          manifests = sorted(Path('collected').rglob('polis-v2-*.manifest.json'))
          if len(manifests) != 120:
              raise SystemExit(f'Expected 120 manifests, found {len(manifests)}')
          manifest_payloads = [json.loads(path.read_text(encoding='utf-8')) for path in manifests]
          bad = [item['run_id'] for item in manifest_payloads if item.get('status') != 'complete' or item.get('study_fingerprint') != expected_fp]
          if bad:
              raise SystemExit(f'Bad manifests: {bad[:10]}')
          if sum(int(item['completed_episodes']) for item in manifest_payloads) != 5280:
              raise SystemExit('Manifest total is not 5280')

          records.sort(key=lambda record: record.completion_key())
          out = Path('results/v2/source')
          out.mkdir(parents=True, exist_ok=True)
          with (out / 'episodes.jsonl').open('w', encoding='utf-8') as handle:
              for record in records:
                  handle.write(record.model_dump_json() + '\n')

          call_counts = Counter()
          cost_by_model = defaultdict(float)
          cost_by_study = defaultdict(float)
          tokens_by_model = Counter()
          dropped_fields = Counter()
          filled_nullable_fields = Counter()
          truncations = 0
          cache_replay_calls = 0
          model_calls = 0
          total_tokens = 0
          evidence_response_cost = 0.0
          for record in records:
              cost_by_study[record.study] += record.episode_cost_usd
              total_tokens += record.episode_tokens
              evidence_response_cost += record.episode_cost_usd
              for call in record.model_calls:
                  model_calls += 1
                  call_counts[call.model] += 1
                  cost_by_model[call.model] += call.usage.cost_usd
                  tokens_by_model[call.model] += call.usage.total_tokens
                  if call.cached:
                      cache_replay_calls += 1
                  if bool(call.response_metadata.get('justification_truncated')):
                      truncations += 1
                  for field in call.response_metadata.get('dropped_extra_fields') or []:
                      dropped_fields[field] += 1
                  for field in call.response_metadata.get('filled_missing_nullable_fields') or []:
                      filled_nullable_fields[field] += 1

          batch_summaries = sorted(Path('collected').rglob('batch-summary.json'))
          if len(batch_summaries) != 4:
              raise SystemExit(f'Expected 4 batch summaries, found {len(batch_summaries)}')
          batch_payloads = [json.loads(path.read_text(encoding='utf-8')) for path in batch_summaries]
          incremental_spend = sum(float(item['incremental_spend_usd']) for item in batch_payloads)
          if incremental_spend > 4.6 + 1e-9:
              raise SystemExit(f'Aggregate recovery budget exceeded: {incremental_spend}')

          revalidation = sorted(Path('collected').rglob('cache-revalidation.json'))
          if len(revalidation) != 4:
              raise SystemExit(f'Expected 4 cache revalidation records, found {len(revalidation)}')
          rejected = []
          for path in revalidation:
              rejected.extend(json.loads(path.read_text(encoding='utf-8'))['removed_cache_objects'])
          if len(rejected) != 4 or len({item['request_sha256'] for item in rejected}) != 1:
              raise SystemExit(f'Unexpected cache-revalidation rejection pattern: {rejected}')

          metadata = {
              'complete': True,
              'protocol_version': protocol.protocol_version,
              'config_digest': protocol.config_digest(),
              'study_fingerprint': expected_fp,
              'design_digest': os.environ['EXPECTED_DESIGN_DIGEST'],
              'execution_sha': os.environ['EXECUTION_SHA'],
              'execution_run_id': os.environ['EXECUTION_RUN_ID'],
              'episodes': len(records),
              'unique_completion_keys': len(set(keys)),
              'study_counts': expected_counts,
              'source_files': len(source_files),
              'manifests': len(manifests),
              'model_calls': model_calls,
              'model_call_counts': dict(sorted(call_counts.items())),
              'total_tokens': total_tokens,
              'tokens_by_model': dict(sorted(tokens_by_model.items())),
              'evidence_response_cost_usd': evidence_response_cost,
              'incremental_v207_recovery_spend_usd': incremental_spend,
              'cost_by_model_usd': dict(sorted(cost_by_model.items())),
              'cost_by_study_usd': dict(sorted(cost_by_study.items())),
              'cache_replay_calls': cache_replay_calls,
              'fresh_provider_calls': model_calls - cache_replay_calls,
              'justification_truncated_model_calls': truncations,
              'dropped_extra_fields': dict(sorted(dropped_fields.items())),
              'filled_missing_nullable_fields': dict(sorted(filled_nullable_fields.items())),
              'recovery_cache_run_id': '31354324514',
              'recovery_cache_objects_before_revalidation': 3285,
              'recovery_cache_objects_valid_under_v207': 3284,
              'recovery_cache_objects_rejected_under_v207': 1,
              'cache_policy': (
                  'Only exact full-request SHA-256 cache hits from prior technical runs were eligible. '
                  'All cached raw responses were re-parsed under the frozen v2.0.7 syntax-only parser before replay. '
                  'One obsolete repaired response failed v2.0.7 parsing and was excluded. Episode outcomes were recomputed under v2.0.7.'
              ),
          }
          for name in ('RUN_MANIFEST.json', 'FINAL_RUN_COMPLETE.json'):
              (out / name).write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'study_fingerprint.txt').write_text(expected_fp + '\n', encoding='utf-8')
          print(json.dumps(metadata, indent=2))
          PY
      - name: Generate preregistered statistics, tables, and figures
        run: python scripts/analyse_v2.py results/v2/source/episodes.jsonl --protocol configs/v2_protocol.json --output results/v2/analysis
      - name: Verify analysis and disarm permanently
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          analysis = json.loads(Path('results/v2/analysis/analysis.json').read_text(encoding='utf-8'))
          if analysis.get('study_fingerprint') != os.environ['EXPECTED_FINGERPRINT']:
              raise SystemExit('Analysis fingerprint mismatch')
          if int(analysis.get('records', -1)) != 5280:
              raise SystemExit(f"Analysis records mismatch: {analysis.get('records')}")
          complete = json.loads(Path('results/v2/source/FINAL_RUN_COMPLETE.json').read_text(encoding='utf-8'))
          if not complete.get('complete') or complete.get('episodes') != 5280 or complete.get('unique_completion_keys') != 5280:
              raise SystemExit('Final completeness gate failed')

          gate_path = Path('configs/v2_live_gate.json')
          gate = json.loads(gate_path.read_text(encoding='utf-8'))
          gate.update({
              'armed': False,
              'status': 'completed',
              'completed_run_id': os.environ['EXECUTION_RUN_ID'],
              'execution_sha': os.environ['EXECUTION_SHA'],
              'completed_at': datetime.now(timezone.utc).isoformat(),
          })
          gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('POLIS v2.0.7 verified complete at exactly 5,280 episodes.')
          PY
      - name: Commit frozen source evidence and analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/v2_live_gate.json results/v2/source results/v2/analysis
          git commit -m "results: add complete POLIS v2.0.7 confirmatory study"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Upload complete v2.0.7 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: polis-v207-complete
          path: results/v2/
          if-no-files-found: error
          retention-days: 90
