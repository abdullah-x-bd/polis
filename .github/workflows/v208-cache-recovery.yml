name: POLIS v2.0.8 zero-spend cache audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v208-cache-recovery.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_CONFIG_DIGEST: f72f6d683b88d1f11b7ec1d840413f805a619a5433ce431c445b16831aa3346b
      EXPECTED_DESIGN_DIGEST: c5d6a750c495d14d0d745a9ee317cd40fa20ecd5c2e3e735fd74b195363182e8
      EXPECTED_FINGERPRINT: f169dc157fd6f31d0f0ce0a76a0c51049f9b0a28eba08fc3201b616e1ce001e3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify corrected frozen v2.0.8 fingerprint
        run: |
          python - <<'PY'
          import os
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest

          p = load_protocol('configs/v2_protocol.json')
          checks = {
              'config': (p.config_digest(), os.environ['EXPECTED_CONFIG_DIGEST']),
              'design': (design_digest(), os.environ['EXPECTED_DESIGN_DIGEST']),
              'fingerprint': (p.study_fingerprint(), os.environ['EXPECTED_FINGERPRINT']),
          }
          for name, (actual, expected) in checks.items():
              print(name, actual)
              if actual != expected:
                  raise SystemExit(f'{name} mismatch: {actual} != {expected}')
          if p.protocol_version != '2.0.8' or p.status != 'frozen':
              raise SystemExit('Expected frozen POLIS v2.0.8')
          PY
      - name: Download consolidated pre-v2.0.8 exact-response cache
        uses: actions/download-artifact@v4
        with:
          name: polis-v207-cache-recovery-audit
          path: sources/base
          github-token: ${{ github.token }}
          run-id: 31354324514
      - name: Download additional exact responses from excluded v2.0.7 recovery attempt
        uses: actions/download-artifact@v4
        with:
          pattern: polis-v207-final-batch-*
          path: sources/v207-final
          github-token: ${{ github.token }}
          run-id: 31357100158
      - name: Merge by complete-request SHA and revalidate raw responses
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from collections import Counter
          from pathlib import Path

          from polis.v1.providers.openrouter import OpenRouterProvider

          target = Path('recovery-v208/cache')
          target.mkdir(parents=True, exist_ok=True)
          sources = [Path('sources/base'), Path('sources/v207-final')]
          candidates = []
          for source in sources:
              candidates.extend(sorted(source.rglob('cache/*.json')))

          duplicate_same = 0
          duplicate_conflicts = []
          copied = 0
          for path in candidates:
              dest = target / path.name
              if dest.exists():
                  if hashlib.sha256(dest.read_bytes()).hexdigest() == hashlib.sha256(path.read_bytes()).hexdigest():
                      duplicate_same += 1
                  else:
                      duplicate_conflicts.append(path.name)
                  continue
              shutil.copy2(path, dest)
              copied += 1

          valid = 0
          rejected = []
          normalized = Counter()
          for path in sorted(target.glob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              response = payload.get('response') or {}
              raw = response.get('raw_text') or ''
              try:
                  action, truncated, dropped, filled = OpenRouterProvider._parse_action_content(raw)
              except Exception as exc:
                  rejected.append({
                      'request_sha256': path.stem,
                      'error': f'{type(exc).__name__}: {exc}',
                  })
                  path.unlink()
                  continue
              response['action'] = action.model_dump(mode='json')
              metadata = dict(response.get('response_metadata') or {})
              metadata.update({
                  'revalidated_under_v208': True,
                  'justification_truncated': truncated,
                  'justification_limit_chars': OpenRouterProvider.JUSTIFICATION_MAX_CHARS,
                  'dropped_extra_fields': dropped,
                  'filled_missing_nullable_fields': filled,
              })
              response['response_metadata'] = metadata
              payload['response'] = response
              path.write_text(json.dumps(payload, sort_keys=True) + '\n', encoding='utf-8')
              valid += 1
              normalized['truncated'] += int(truncated)
              normalized['dropped_fields'] += len(dropped)
              normalized['filled_nullable_fields'] += len(filled)

          merge = {
              'candidate_cache_files': len(candidates),
              'unique_cache_files_before_revalidation': copied,
              'duplicate_identical_files': duplicate_same,
              'duplicate_conflict_hashes': sorted(set(duplicate_conflicts)),
              'valid_cache_objects': valid,
              'rejected_cache_objects': rejected,
              'normalization_counts': dict(normalized),
          }
          Path('recovery-v208/cache-merge-audit.json').write_text(
              json.dumps(merge, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(merge, indent=2))
          if duplicate_conflicts:
              raise SystemExit(f'Conflicting cached responses for identical request hashes: {sorted(set(duplicate_conflicts))[:10]}')
          PY
      - name: Audit all 5,280 episodes with network disabled by budget guard
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from polis.v1.model_agents import ModelAgent
          from polis.v1.providers.budget import BudgetExceeded, BudgetTracker
          from polis.v1.providers.cache import FileResponseCache
          from polis.v1.providers.openrouter import OpenRouterProvider
          from polis.v2.commons import QuotaSalienceEnvironment
          from polis.v2.delegation import RecoverableDelegationEnvironment
          from polis.v2.live import build_episode_specs
          from polis.v2.models import CommonsRegime, GovernanceRegime
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest

          expected_fp = 'f169dc157fd6f31d0f0ce0a76a0c51049f9b0a28eba08fc3201b616e1ce001e3'
          expected_design = 'c5d6a750c495d14d0d745a9ee317cd40fa20ecd5c2e3e735fd74b195363182e8'
          protocol = load_protocol('configs/v2_protocol.json')
          if protocol.study_fingerprint() != expected_fp or design_digest() != expected_design:
              raise SystemExit('Frozen v2.0.8 changed before cache-coverage audit')

          budget = BudgetTracker(
              max_cost_usd=0.000001,
              ledger_path=Path('recovery-v208/zero-spend-ledger.jsonl'),
              reserve_per_request_usd=0.01,
          )
          provider = OpenRouterProvider(
              cache=FileResponseCache('recovery-v208/cache'),
              budget=budget,
              api_key='cache-only-no-network',
              max_tokens=protocol.max_tokens,
              temperature=protocol.temperature,
              reasoning_overrides=protocol.reasoning_overrides(),
              reasoning_effort_overrides=protocol.reasoning_effort_overrides(),
          )

          def principal_for(scenario, agent_id):
              for item in scenario.agents:
                  if item.agent_id == agent_id:
                      return getattr(item, 'principal_id', item.agent_id)
              raise ValueError(agent_id)

          studies = [
              'delegation_main', 'wording_robustness', 'heterogeneous',
              'commons_salience', 'frontier',
          ]
          complete = []
          missing = []
          cached_calls = 0
          calls_by_model = Counter()

          for study in studies:
              for spec in build_episode_specs(protocol, study):
                  agents = {
                      agent_id: ModelAgent(
                          agent_id=agent_id,
                          principal_id=principal_for(spec.scenario, agent_id),
                          provider=provider,
                          model=model,
                      )
                      for agent_id, model in spec.model_map.items()
                  }
                  try:
                      if study == 'commons_salience':
                          result = QuotaSalienceEnvironment(
                              spec.scenario, CommonsRegime(spec.governance)
                          ).run(agents, model_name=spec.composition_name)
                      else:
                          result = RecoverableDelegationEnvironment(
                              spec.scenario,
                              GovernanceRegime(spec.governance),
                              study=study,
                              max_actions=protocol.max_delegation_actions,
                              model_composition=spec.composition_name,
                          ).run(agents)
                      responses = [r for agent in agents.values() for r in agent.responses]
                      cached_calls += len(responses)
                      calls_by_model.update(r.model for r in responses)
                      complete.append({
                          'study': study,
                          'scenario_id': spec.scenario_id,
                          'governance': spec.governance,
                          'model_composition': spec.composition_name,
                          'cached_model_calls': len(responses),
                          'result_type': type(result).__name__,
                      })
                  except BudgetExceeded:
                      responses = [r for agent in agents.values() for r in agent.responses]
                      cached_calls += len(responses)
                      calls_by_model.update(r.model for r in responses)
                      missing.append({
                          'study': study,
                          'scenario_id': spec.scenario_id,
                          'governance': spec.governance,
                          'model_composition': spec.composition_name,
                          'cached_calls_before_first_miss': len(responses),
                      })

          by_study_complete = Counter(item['study'] for item in complete)
          by_study_missing = Counter(item['study'] for item in missing)
          by_model_missing = Counter(item['model_composition'] for item in missing)
          summary = {
              'protocol_version': protocol.protocol_version,
              'study_fingerprint': protocol.study_fingerprint(),
              'design_digest': design_digest(),
              'expected_episodes': 5280,
              'cache_complete_episodes': len(complete),
              'episodes_requiring_at_least_one_uncached_request': len(missing),
              'complete_by_study': dict(sorted(by_study_complete.items())),
              'missing_by_study': dict(sorted(by_study_missing.items())),
              'missing_by_model_or_composition': dict(sorted(by_model_missing.items())),
              'cached_model_calls_replayed': cached_calls,
              'cached_calls_by_model': dict(sorted(calls_by_model.items())),
              'network_calls': 0,
              'provider_spend_usd': budget.spent_usd,
          }
          Path('recovery-v208/cache-audit-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('recovery-v208/cache-audit-missing.json').write_text(
              json.dumps(missing, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2))
          if len(complete) + len(missing) != 5280:
              raise SystemExit('Cache audit did not cover exactly 5,280 episode specs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: polis-v208-cache-recovery-audit
          path: recovery-v208/
          retention-days: 90
          if-no-files-found: error
