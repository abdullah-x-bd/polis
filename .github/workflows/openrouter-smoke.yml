name: OpenRouter smoke test

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model slug
        required: true
        default: openai/gpt-oss-120b

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      POLIS_MAX_COST_USD: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify secret exists
        run: |
          python - <<'PY'
          import os
          if not os.getenv("OPENROUTER_API_KEY"):
              raise SystemExit("OPENROUTER_API_KEY repository secret is not configured")
          print("OPENROUTER_API_KEY is configured")
          PY
      - name: Run one structured-action request
        run: python scripts/test_openrouter.py --model "${{ inputs.model }}" --max-cost-usd 0.25
