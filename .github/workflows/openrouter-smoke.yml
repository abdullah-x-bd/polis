name: OpenRouter smoke test

on:
  workflow_dispatch:
    inputs:
      model:
        description: Frozen OpenRouter model slug
        required: true
        default: google/gemini-2.5-flash-lite
      confirmation:
        description: Type RUN_ROTATED_KEY to confirm OPENROUTER_API_KEY has been rotated since any exposure
        required: true
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      POLIS_MAX_COST_USD: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify explicit paid-run gate
        run: |
          if [ "${{ inputs.confirmation }}" != "RUN_ROTATED_KEY" ]; then
            echo "Refusing paid smoke test until the key-rotation confirmation is supplied."
            exit 1
          fi
          python - <<'PY'
          import os
          if not os.getenv("OPENROUTER_API_KEY"):
              raise SystemExit("OPENROUTER_API_KEY repository secret is not configured")
          print("OpenRouter secret is configured; secret value is not printed.")
          PY
      - name: Run one structured-action request
        run: python scripts/test_openrouter.py --model "${{ inputs.model }}" --max-cost-usd 0.25
