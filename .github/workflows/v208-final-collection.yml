name: POLIS v2.0.8 final confirmatory collection

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v208-final-collection.yml

concurrency:
  group: polis-v208-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify immutable v2.0.8 execution gate
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          from polis.v2.live import build_episode_specs
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import HETEROGENEOUS_COMPOSITIONS, design_digest

          expected_fp = 'f169dc157fd6f31d0f0ce0a76a0c51049f9b0a28eba08fc3201b616e1ce001e3'
          expected_config = 'f72f6d683b88d1f11b7ec1d840413f805a619a5433ce431c445b16831aa3346b'
          expected_design = 'c5d6a750c495d14d0d745a9ee317cd40fa20ecd5c2e3e735fd74b195363182e8'
          p = load_protocol('configs/v2_protocol.json')
          if p.protocol_version != '2.0.8' or p.status != 'frozen':
              raise SystemExit('Paid execution requires frozen POLIS v2.0.8')
          if p.study_fingerprint() != expected_fp:
              raise SystemExit('v2.0.8 fingerprint changed')
          if p.config_digest() != expected_config or design_digest() != expected_design:
              raise SystemExit('v2.0.8 config/design digest changed')
          counts = {
              study: len(build_episode_specs(p, study))
              for study in [
                  'delegation_main', 'wording_robustness', 'heterogeneous',
                  'commons_salience', 'frontier',
              ]
          }
          expected_counts = {
              'delegation_main': 2304,
              'wording_robustness': 1152,
              'heterogeneous': 576,
              'commons_salience': 960,
              'frontier': 288,
          }
          if counts != expected_counts or sum(counts.values()) != 5280:
              raise SystemExit(f'Unexpected v2.0.8 study matrix: {counts}')
          cheap = {item.id for item in p.cheap_models}
          heterogeneous_models = {
              model
              for composition in HETEROGENEOUS_COMPOSITIONS
              for key, model in composition.items()
              if key.startswith('agent_')
          }
          if not heterogeneous_models <= cheap:
              raise SystemExit(f'Heterogeneous panel drift: {sorted(heterogeneous_models - cheap)}')
          if os.environ['HEAD_BRANCH'] != 'polis-v2-final-207':
              raise SystemExit(f'Unexpected paid-execution branch: {os.environ["HEAD_BRANCH"]}')
          print('V208_FINAL_GATE=PASS')
          print('HEAD_SHA=' + os.environ['HEAD_SHA'])
          print('STUDY_COUNTS=' + str(counts))
          PY

  collect:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BATCH: ${{ matrix.batch }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      EXPECTED_FINGERPRINT: f169dc157fd6f31d0f0ce0a76a0c51049f9b0a28eba08fc3201b616e1ce001e3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Download audited admissible exact-response cache
        uses: actions/download-artifact@v4
        with:
          name: polis-v208-admissible-cache
          path: bootstrap
          github-token: ${{ github.token }}
          run-id: 31359535850
      - name: Prepare batch cache
        run: |
          set -euo pipefail
          OUT="results/v208-final/batch-${BATCH}"
          mkdir -p "$OUT/cache"
          CACHE_DIR="$(find bootstrap -type d -name cache | head -n 1)"
          if [ -z "$CACHE_DIR" ]; then
            echo "Audited cache directory not found" >&2
            exit 1
          fi
          cp -a "$CACHE_DIR"/. "$OUT/cache/"
          echo "BOOTSTRAP_CACHE_OBJECTS=$(find "$OUT/cache" -type f -name '*.json' | wc -l)"
      - name: Collect one disjoint eighth of every frozen study
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          from polis.v1.providers.budget import BudgetExceeded, BudgetTracker
          from polis.v1.providers.cache import FileResponseCache
          from polis.v1.providers.openrouter import OpenRouterProvider
          from polis.v2.live import run_study
          from polis.v2.protocol import load_protocol

          batch = int(os.environ['BATCH'])
          shard_count = 8
          out = Path(f'results/v208-final/batch-{batch}')
          retry_path = out / 'retry-events.jsonl'
          protocol = load_protocol('configs/v2_protocol.json')
          if protocol.study_fingerprint() != os.environ['EXPECTED_FINGERPRINT']:
              raise SystemExit('Fingerprint mismatch immediately before paid collection')

          # Ensure manifests record the checked-out research code, not the synthetic PR merge ref.
          os.environ['GITHUB_SHA'] = os.environ['HEAD_SHA']

          budget = BudgetTracker(
              max_cost_usd=1.25,
              ledger_path=out / f'ledger-v208-batch-{batch}.jsonl',
              reserve_per_request_usd=0.01,
          )
          base = OpenRouterProvider(
              cache=FileResponseCache(out / 'cache'),
              budget=budget,
              max_tokens=protocol.max_tokens,
              temperature=protocol.temperature,
              reasoning_overrides=protocol.reasoning_overrides(),
              reasoning_effort_overrides=protocol.reasoning_effort_overrides(),
          )

          class RetryingProvider:
              def act(self, observation, model):
                  for attempt in (1, 2):
                      try:
                          return base.act(observation, model)
                      except BudgetExceeded:
                          raise
                      except Exception as exc:
                          event = {
                              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
                              'model': model,
                              'attempt': attempt,
                              'error_type': type(exc).__name__,
                              'error': str(exc)[:500],
                          }
                          with retry_path.open('a', encoding='utf-8') as handle:
                              handle.write(json.dumps(event, sort_keys=True) + '\n')
                          if attempt == 2:
                              raise
                          time.sleep(2.0)
                  raise AssertionError('unreachable')

          provider = RetryingProvider()
          studies = [
              'delegation_main',
              'wording_robustness',
              'heterogeneous',
              'commons_salience',
              'frontier',
          ]
          manifests = []
          for study in studies:
              manifest = run_study(
                  protocol=protocol,
                  provider=provider,
                  study=study,
                  output_dir=out,
                  shard_index=batch,
                  shard_count=shard_count,
                  run_id=f'polis-v208-final-{study}-b{batch}of{shard_count}-run{os.environ["WORKFLOW_RUN_ID"]}',
              )
              if manifest.status != 'complete' or manifest.completed_episodes != manifest.expected_episodes:
                  raise SystemExit(f'Incomplete {study} batch {batch}: {manifest.model_dump()}')
              manifests.append(manifest.model_dump(mode='json'))

          summary = {
              'batch': batch,
              'shard_count': shard_count,
              'head_sha': os.environ['HEAD_SHA'],
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'protocol_version': protocol.protocol_version,
              'study_fingerprint': protocol.study_fingerprint(),
              'completed_episodes': sum(item['completed_episodes'] for item in manifests),
              'expected_episodes': sum(item['expected_episodes'] for item in manifests),
              'incremental_provider_spend_usd': budget.spent_usd,
              'hard_batch_budget_usd': budget.max_cost_usd,
              'manifests': manifests,
          }
          (out / 'batch-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if summary['completed_episodes'] != 660:
              raise SystemExit(f'Each batch must contain exactly 660 episodes, got {summary["completed_episodes"]}')
          PY
      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polis-v208-final-batch-${{ matrix.batch }}
          path: results/v208-final/batch-${{ matrix.batch }}/
          retention-days: 90
          if-no-files-found: error

  analyse:
    needs: [gate, collect]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      EXPECTED_FINGERPRINT: f169dc157fd6f31d0f0ce0a76a0c51049f9b0a28eba08fc3201b616e1ce001e3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Download every batch artifact
        uses: actions/download-artifact@v4
        with:
          pattern: polis-v208-final-batch-*
          path: combined
          merge-multiple: false
      - name: Enforce exact 5,280 episode completeness before analysis
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          from polis.v2.live import V2EpisodeRecord
          from polis.v2.protocol import load_protocol

          protocol = load_protocol('configs/v2_protocol.json')
          paths = sorted(Path('combined').rglob('polis-v208-final-*.jsonl'))
          records = []
          for path in paths:
              if path.name.startswith('ledger-') or path.name == 'retry-events.jsonl':
                  continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      records.append(V2EpisodeRecord.model_validate_json(line))

          keys = [record.completion_key() for record in records]
          counts = Counter(record.study for record in records)
          expected_counts = {
              'delegation_main': 2304,
              'wording_robustness': 1152,
              'heterogeneous': 576,
              'commons_salience': 960,
              'frontier': 288,
          }
          fingerprints = {record.study_fingerprint for record in records}
          versions = {record.protocol_version for record in records}
          allowed_models = {item.id for item in protocol.cheap_models + protocol.frontier_models}
          observed_models = {call.model for record in records for call in record.model_calls}
          unexpected_models = sorted(observed_models - allowed_models)
          audit = {
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'head_sha': os.environ['HEAD_SHA'],
              'expected_episodes': 5280,
              'observed_episodes': len(records),
              'unique_episode_keys': len(set(keys)),
              'duplicate_episode_keys': len(keys) - len(set(keys)),
              'counts_by_study': dict(sorted(counts.items())),
              'expected_counts_by_study': expected_counts,
              'fingerprints': sorted(fingerprints),
              'protocol_versions': sorted(versions),
              'unexpected_models': unexpected_models,
              'source_jsonl_files': [str(path) for path in paths],
          }
          Path('final').mkdir(parents=True, exist_ok=True)
          Path('final/collection-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(audit, indent=2, sort_keys=True))
          if len(records) != 5280 or len(set(keys)) != 5280:
              raise SystemExit('Final v2.0.8 collection is not exactly 5,280 unique episodes')
          if dict(counts) != expected_counts:
              raise SystemExit(f'Per-study completeness mismatch: {dict(counts)}')
          if fingerprints != {os.environ['EXPECTED_FINGERPRINT']} or versions != {'2.0.8'}:
              raise SystemExit('Protocol provenance mismatch in final records')
          if unexpected_models:
              raise SystemExit(f'Unexpected model IDs in final data: {unexpected_models}')
          PY
      - name: Run preregistered v2 analysis
        run: |
          mapfile -t SOURCES < <(find combined -type f -name 'polis-v208-final-*.jsonl' | sort)
          python scripts/analyse_v2.py "${SOURCES[@]}" --protocol configs/v2_protocol.json --output final/analysis
      - name: Write immutable completion record and publication source bundle
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          audit = json.loads(Path('final/collection-audit.json').read_text(encoding='utf-8'))
          analysis = json.loads(Path('final/analysis/analysis.json').read_text(encoding='utf-8'))

          incremental_spend = 0.0
          new_paid_calls = 0
          for ledger in Path('combined').rglob('ledger-v208-batch-*.jsonl'):
              for line in ledger.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  incremental_spend += float(row.get('cost_usd') or 0.0)
                  new_paid_calls += 1

          retry_events = 0
          for retry_file in Path('combined').rglob('retry-events.jsonl'):
              retry_events += sum(1 for line in retry_file.read_text(encoding='utf-8').splitlines() if line.strip())

          source_dir = Path('final/source')
          source_dir.mkdir(parents=True, exist_ok=True)
          for pattern in ('polis-v208-final-*.jsonl', 'polis-v208-final-*.manifest.json', 'batch-summary.json', 'ledger-v208-batch-*.jsonl', 'retry-events.jsonl'):
              for src in Path('combined').rglob(pattern):
                  batch_name = src.parent.name
                  dest = source_dir / f'{batch_name}__{src.name}'
                  shutil.copy2(src, dest)

          completion = {
              'complete': True,
              'protocol_version': '2.0.8',
              'study_fingerprint': os.environ['EXPECTED_FINGERPRINT'],
              'head_sha': os.environ['HEAD_SHA'],
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'expected_episodes': 5280,
              'observed_episodes': audit['observed_episodes'],
              'unique_episode_keys': audit['unique_episode_keys'],
              'counts_by_study': audit['counts_by_study'],
              'total_model_calls_in_dataset': analysis['costs']['total_model_calls'],
              'total_tokens_in_dataset': analysis['costs']['total_tokens'],
              'provider_reported_response_cost_usd_in_dataset': analysis['costs']['total_cost_usd'],
              'incremental_paid_calls_in_v208_final_run': new_paid_calls,
              'incremental_provider_spend_usd_in_v208_final_run': incremental_spend,
              'retry_events': retry_events,
              'hard_parallel_budget_ceiling_usd': 10.0,
              'audited_bootstrap_cache_run_id': 31359535850,
              'audited_bootstrap_cache_artifact_id': 9051840187,
          }
          Path('final/FINAL_RUN_COMPLETE.json').write_text(
              json.dumps(completion, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(completion, indent=2, sort_keys=True))
          PY
      - name: Upload complete v2.0.8 research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polis-v208-final-complete-${{ github.run_id }}
          path: final/
          retention-days: 90
          if-no-files-found: error
