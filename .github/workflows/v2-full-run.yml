name: POLIS v2.0.2 full confirmatory run

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description: Exact frozen execution SHA. Leave blank to use the selected ref SHA.
        required: false
        type: string
      head_branch:
        description: Branch to receive validated combined evidence and analysis.
        required: false
        type: string

jobs:
  live:
    name: live batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - batch: 0
            shards: "0 1 2 3 4 5"
          - batch: 1
            shards: "6 7 8 9 10 11"
          - batch: 2
            shards: "12 13 14 15 16 17"
          - batch: 3
            shards: "18 19 20 21 22 23"
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXPECTED_CONFIG_DIGEST: b947c916ace60ae3e64f5ca047b9bb10b10ce02b6151badd2c248838387e1aa5
      EXPECTED_DESIGN_DIGEST: 6efba6e49955923ce13d70e7e4e672f3173a83c1bed0522b7eae65452023b964
      EXPECTED_FINGERPRINT: e49d69fb88fed250268aba7d9e9912b98bbb07cacbc114a1a0ba05e4480e44f2
      BATCH_BUDGET_USD: "0.90"
      EXECUTION_SHA: ${{ inputs.execution_sha || github.sha }}
      BATCH_INDEX: ${{ matrix.batch }}
      SHARD_LIST: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify immutable execution fingerprint
        run: |
          python - <<'PY'
          import os
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest
          p = load_protocol('configs/v2_protocol.json')
          checks = {
              'config': (p.config_digest(), os.environ['EXPECTED_CONFIG_DIGEST']),
              'design': (design_digest(), os.environ['EXPECTED_DESIGN_DIGEST']),
              'fingerprint': (p.study_fingerprint(), os.environ['EXPECTED_FINGERPRINT']),
          }
          for name, (actual, expected) in checks.items():
              print(name, actual)
              if actual != expected:
                  raise SystemExit(f'{name} mismatch: {actual} != {expected}')
          if p.protocol_version != '2.0.2' or p.status != 'frozen':
              raise SystemExit('Live collection requires frozen v2.0.2')
          PY
      - name: Execute six frozen shards under one hard batch budget
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from polis.v1.providers.budget import BudgetTracker
          from polis.v1.providers.cache import FileResponseCache
          from polis.v1.providers.openrouter import OpenRouterProvider
          from polis.v2.live import run_study
          from polis.v2.protocol import load_protocol

          protocol = load_protocol('configs/v2_protocol.json')
          if protocol.study_fingerprint() != os.environ['EXPECTED_FINGERPRINT']:
              raise SystemExit('Fingerprint changed after preflight')

          batch = int(os.environ['BATCH_INDEX'])
          shards = [int(x) for x in os.environ['SHARD_LIST'].split()]
          root = Path(f'results/v2/live/batch-{batch}')
          root.mkdir(parents=True, exist_ok=True)
          os.environ['GITHUB_SHA'] = os.environ['EXECUTION_SHA']

          budget = BudgetTracker(
              max_cost_usd=float(os.environ['BATCH_BUDGET_USD']),
              ledger_path=root / f'ledger-batch-{batch}.jsonl',
              reserve_per_request_usd=0.01,
          )
          provider = OpenRouterProvider(
              cache=FileResponseCache(root / 'cache'),
              budget=budget,
              max_tokens=protocol.max_tokens,
              temperature=protocol.temperature,
          )
          studies = [
              'delegation_main',
              'wording_robustness',
              'heterogeneous',
              'commons_salience',
              'frontier',
          ]
          manifests = []
          for shard in shards:
              for study in studies:
                  manifest = run_study(
                      protocol=protocol,
                      provider=provider,
                      study=study,
                      output_dir=root / f'shard-{shard:02d}' / study,
                      shard_index=shard,
                      shard_count=24,
                  )
                  manifests.append(manifest.model_dump(mode='json'))
                  if manifest.status != 'complete':
                      raise SystemExit(f'Incomplete manifest: {manifest.run_id} status={manifest.status}')

          summary = {
              'batch': batch,
              'shards': shards,
              'manifests': len(manifests),
              'completed_episodes': sum(x['completed_episodes'] for x in manifests),
              'recorded_spend_usd': budget.spent_usd,
              'budget_usd': float(os.environ['BATCH_BUDGET_USD']),
              'study_fingerprint': protocol.study_fingerprint(),
              'execution_sha': os.environ['EXECUTION_SHA'],
          }
          (root / 'batch-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polis-v2-batch-${{ matrix.batch }}
          path: results/v2/live/batch-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 30

  analyse:
    name: combine, validate, analyse, and commit evidence
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPECTED_FINGERPRINT: e49d69fb88fed250268aba7d9e9912b98bbb07cacbc114a1a0ba05e4480e44f2
      EXPECTED_DESIGN_DIGEST: 6efba6e49955923ce13d70e7e4e672f3173a83c1bed0522b7eae65452023b964
      EXECUTION_SHA: ${{ inputs.execution_sha || github.sha }}
      HEAD_BRANCH: ${{ inputs.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: polis-v2-batch-*
          path: collected
          merge-multiple: true
      - name: Validate and combine 5,280 frozen episodes
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          from polis.v2.live import V2EpisodeRecord
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest

          expected_counts = {
              'delegation_main': 2304,
              'wording_robustness': 1152,
              'heterogeneous': 576,
              'commons_salience': 960,
              'frontier': 288,
          }
          expected_fp = os.environ['EXPECTED_FINGERPRINT']
          protocol = load_protocol('configs/v2_protocol.json')
          if protocol.study_fingerprint() != expected_fp or design_digest() != os.environ['EXPECTED_DESIGN_DIGEST']:
              raise SystemExit('Frozen protocol/design changed before combination')

          source_files = sorted(Path('collected').rglob('polis-v2-*.jsonl'))
          if len(source_files) != 120:
              raise SystemExit(f'Expected 120 shard-study result files, found {len(source_files)}')

          records = []
          for path in source_files:
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      records.append(V2EpisodeRecord.model_validate_json(line))
          if len(records) != 5280:
              raise SystemExit(f'Expected 5280 episodes, found {len(records)}')
          keys = [r.completion_key() for r in records]
          if len(set(keys)) != 5280:
              dupes = [k for k, n in Counter(keys).items() if n > 1][:10]
              raise SystemExit(f'Duplicate completion keys detected: {dupes}')
          if {r.study_fingerprint for r in records} != {expected_fp}:
              raise SystemExit('Mixed or incorrect study fingerprints detected')
          counts = Counter(r.study for r in records)
          if dict(counts) != expected_counts:
              raise SystemExit(f'Study counts mismatch: {dict(counts)}')

          manifests = sorted(Path('collected').rglob('*.manifest.json'))
          if len(manifests) != 120:
              raise SystemExit(f'Expected 120 manifests, found {len(manifests)}')
          manifest_payloads = [json.loads(p.read_text(encoding='utf-8')) for p in manifests]
          bad = [m['run_id'] for m in manifest_payloads if m.get('status') != 'complete' or m.get('study_fingerprint') != expected_fp]
          if bad:
              raise SystemExit(f'Incomplete or mismatched manifests: {bad[:10]}')
          if sum(int(m['completed_episodes']) for m in manifest_payloads) != 5280:
              raise SystemExit('Manifest completed-episode total is not 5280')

          records.sort(key=lambda r: r.completion_key())
          out = Path('results/v2/source')
          out.mkdir(parents=True, exist_ok=True)
          combined = out / 'episodes.jsonl'
          with combined.open('w', encoding='utf-8') as fh:
              for record in records:
                  fh.write(record.model_dump_json() + '\n')

          model_calls = sum(len(r.model_calls) for r in records)
          total_tokens = sum(r.episode_tokens for r in records)
          total_cost = sum(r.episode_cost_usd for r in records)
          metadata = {
              'protocol_version': protocol.protocol_version,
              'study_fingerprint': expected_fp,
              'design_digest': os.environ['EXPECTED_DESIGN_DIGEST'],
              'execution_sha': os.environ['EXECUTION_SHA'],
              'episodes': len(records),
              'study_counts': expected_counts,
              'source_files': len(source_files),
              'manifests': len(manifests),
              'model_calls': model_calls,
              'total_tokens': total_tokens,
              'provider_reported_cost_usd': total_cost,
          }
          (out / 'RUN_MANIFEST.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'study_fingerprint.txt').write_text(expected_fp + '\n', encoding='utf-8')
          print(json.dumps(metadata, indent=2))
          PY
      - name: Generate preregistered statistics, tables, and figures
        run: |
          python scripts/analyse_v2.py \
            results/v2/source/episodes.jsonl \
            --protocol configs/v2_protocol.json \
            --output results/v2/analysis
      - name: Verify generated analysis fingerprint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('results/v2/analysis/analysis.json').read_text(encoding='utf-8'))
          if payload.get('study_fingerprint') != os.environ['EXPECTED_FINGERPRINT']:
              raise SystemExit('Analysis fingerprint mismatch')
          if int(payload.get('records', -1)) != 5280:
              raise SystemExit(f"Analysis expected 5280 records, got {payload.get('records')}")
          print('Analysis verified for 5,280 frozen episodes.')
          PY
      - name: Commit complete v2 evidence and generated analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v2/source results/v2/analysis
          git commit -m "results: add POLIS v2.0.2 confirmatory evidence and analysis"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Upload complete research artifact
        uses: actions/upload-artifact@v4
        with:
          name: polis-v2-complete
          path: results/v2/
          if-no-files-found: error
          retention-days: 90
