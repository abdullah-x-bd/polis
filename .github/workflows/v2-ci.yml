name: POLIS v2 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research environment
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/polis/v2 tests/test_v2.py scripts/run_v2.py scripts/analyse_v2.py scripts/stress_v2.py
      - name: Compile
        run: python -m compileall -q src/polis/v2 scripts/run_v2.py scripts/analyse_v2.py scripts/stress_v2.py
      - name: Tests
        run: pytest tests/test_v2.py
      - name: Zero-cost scripted mechanism stress suite
        run: python scripts/stress_v2.py --output /tmp/polis-v2-scripted-stress.json
      - name: Print all preregistered study plans without API calls
        run: |
          python scripts/run_v2.py --study delegation_main --dry-run
          python scripts/run_v2.py --study wording_robustness --dry-run
          python scripts/run_v2.py --study heterogeneous --dry-run
          python scripts/run_v2.py --study commons_salience --dry-run
          python scripts/run_v2.py --study frontier --dry-run
