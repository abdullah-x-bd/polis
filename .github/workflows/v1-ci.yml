name: POLIS v1 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Tests
        run: pytest
      - name: Zero-cost Commons calibration
        run: python scripts/calibrate_commons_v1.py --output /tmp/commons_v1.json
      - name: Zero-cost delegation stress suite
        run: python scripts/stress_delegation_v1.py --output /tmp/delegation_v1.json
