name: POLIS v2.0.2 live preflight

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v2-live-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXPECTED_CONFIG_DIGEST: b947c916ace60ae3e64f5ca047b9bb10b10ce02b6151badd2c248838387e1aa5
      EXPECTED_DESIGN_DIGEST: 6efba6e49955923ce13d70e7e4e672f3173a83c1bed0522b7eae65452023b964
      EXPECTED_FINGERPRINT: e49d69fb88fed250268aba7d9e9912b98bbb07cacbc114a1a0ba05e4480e44f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify pinned frozen hashes
        run: |
          python - <<'PY'
          import json, os
          from polis.v2.protocol import load_protocol
          from polis.v2.scenarios import design_digest

          protocol = load_protocol('configs/v2_protocol.json')
          actual = {
              'config_digest': protocol.config_digest(),
              'design_digest': design_digest(),
              'study_fingerprint': protocol.study_fingerprint(),
          }
          expected = {
              'config_digest': os.environ['EXPECTED_CONFIG_DIGEST'],
              'design_digest': os.environ['EXPECTED_DESIGN_DIGEST'],
              'study_fingerprint': os.environ['EXPECTED_FINGERPRINT'],
          }
          print('FROZEN_HASHES=' + json.dumps(actual, sort_keys=True))
          if protocol.status != 'frozen' or protocol.protocol_version != '2.0.2':
              raise SystemExit(f'Expected frozen protocol 2.0.2, got {protocol.protocol_version} / {protocol.status}')
          if actual != expected:
              raise SystemExit(f'Frozen hash mismatch: expected={expected} actual={actual}')
          PY
      - name: Dry-run all frozen studies
        run: |
          for study in delegation_main wording_robustness heterogeneous commons_salience frontier; do
            python scripts/run_v2.py \
              --protocol configs/v2_protocol.json \
              --study "$study" \
              --output /tmp/polis-v2-preflight \
              --shard-index 0 \
              --shard-count 24 \
              --dry-run
          done
      - name: Inspect OpenRouter key budget safely
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key = os.environ.get('OPENROUTER_API_KEY')
          if not key:
              raise SystemExit('OPENROUTER_API_KEY repository secret is not configured')
          req = urllib.request.Request(
              'https://openrouter.ai/api/v1/key',
              headers={'Authorization': f'Bearer {key}'},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.load(r)
          data = payload.get('data', payload)
          safe = {k: data.get(k) for k in ('label','limit','usage','limit_remaining','usage_daily','usage_weekly','usage_monthly')}
          print('OPENROUTER_KEY_SAFE=' + json.dumps(safe, sort_keys=True))
          PY
