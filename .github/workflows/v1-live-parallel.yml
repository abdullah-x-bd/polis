name: POLIS v1 parallel confirmatory execution

on:
  pull_request:
    branches: [main]

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        model:
          - google/gemini-2.5-flash-lite
          - mistralai/mistral-small-2603
          - openai/gpt-4.1-mini
        shard: [0, 1, 2, 3]
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Verify secret and shard plan
        run: |
          python - <<'PY'
          import os
          if not os.getenv("OPENROUTER_API_KEY"):
              raise SystemExit("OPENROUTER_API_KEY repository secret is not configured")
          print("OpenRouter secret is configured; secret value is not printed.")
          PY
          python scripts/run_v1_live.py \
            --mode full \
            --model "${{ matrix.model }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --dry-run
      - name: Run paid shard with resumable retries
        run: |
          MODEL="${{ matrix.model }}"
          case "$MODEL" in
            google/*) LIMIT="0.25" ;;
            mistralai/*) LIMIT="0.30" ;;
            openai/*) LIMIT="0.60" ;;
            *) exit 2 ;;
          esac

          for ATTEMPT in 1 2 3; do
            echo "POLIS shard attempt ${ATTEMPT}/3 for ${MODEL}, shard ${{ matrix.shard }}"
            if python scripts/run_v1_live.py \
              --mode full \
              --model "$MODEL" \
              --shard-index "${{ matrix.shard }}" \
              --shard-count 4 \
              --max-cost-usd "$LIMIT"; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Shard interrupted. Existing episode records and cost ledger will be resumed."
              sleep 8
            fi
          done
          echo "Shard did not complete after three resumable attempts."
          exit 1
      - name: Prepare uniquely named shard artifacts
        if: always()
        run: |
          MODEL="${{ matrix.model }}"
          case "$MODEL" in
            google/*) SAFE="gemini" ;;
            mistralai/*) SAFE="mistral" ;;
            openai/*) SAFE="openai" ;;
            *) SAFE="unknown" ;;
          esac
          mkdir -p shard-out
          for f in results/live/polis-v1-full-*.jsonl; do
            [ -f "$f" ] && cp "$f" "shard-out/full-${SAFE}-s${{ matrix.shard }}.jsonl"
          done
          for f in results/live/polis-v1-full-*.manifest.json; do
            [ -f "$f" ] && cp "$f" "shard-out/full-${SAFE}-s${{ matrix.shard }}.manifest.json"
          done
          if [ -f results/live/openrouter_ledger.jsonl ]; then
            cp results/live/openrouter_ledger.jsonl "shard-out/ledger-${SAFE}-s${{ matrix.shard }}.jsonl"
          fi
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polis-shard-${{ strategy.job-index }}
          path: shard-out/**
          if-no-files-found: warn
          retention-days: 90

  analyse:
    needs: shard
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POLIS
        run: pip install -e ".[dev]"
      - name: Download all disjoint shards
        uses: actions/download-artifact@v4
        with:
          pattern: polis-shard-*
          path: shards
          merge-multiple: true
      - name: Verify exact frozen matrix coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from polis.v1.live import load_records
          files = sorted(Path('shards').glob('full-*.jsonl'))
          records = [record for path in files for record in load_records(path)]
          keys = [record.completion_key() for record in records]
          print(f"source files={len(files)} records={len(records)} unique_keys={len(set(keys))}")
          if len(files) != 12:
              raise SystemExit(f"Expected 12 source shards, got {len(files)}")
          if len(records) != 576 or len(set(keys)) != 576:
              raise SystemExit("Shards do not form the exact 576-episode matrix")
          PY
      - name: Generate final statistical artifacts
        run: python scripts/analyse_v1.py shards/full-*.jsonl --output results/analysis
      - name: Write final completion record
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from polis.v1.live import load_records
          from polis.v1.protocol import load_protocol
          protocol = load_protocol('configs/v1_live.json')
          files = sorted(Path('shards').glob('full-*.jsonl'))
          records = [r for p in files for r in load_records(p)]
          payload = {
              'git_sha': os.getenv('GITHUB_SHA'),
              'protocol_fingerprint': protocol.fingerprint(),
              'source_shards': len(files),
              'observed_episodes': len(records),
              'unique_episode_keys': len({r.completion_key() for r in records}),
              'complete': len(records) == 576 and len({r.completion_key() for r in records}) == 576,
          }
          Path('results/FINAL_RUN_COMPLETE.json').write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload, indent=2))
          if not payload['complete']:
              raise SystemExit('Final matrix incomplete')
          PY
      - name: Upload final combined research artifact
        uses: actions/upload-artifact@v4
        with:
          name: polis-v1-final-parallel-${{ github.run_id }}
          path: |
            shards/**
            results/analysis/**
            results/FINAL_RUN_COMPLETE.json
          retention-days: 90
